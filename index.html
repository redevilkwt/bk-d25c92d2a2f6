<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Black — لوحة العملاء</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg1:#f3e2d0;--bg2:#e4e8de;--card:#ffffffb8;--card2:#f4f2ea;--ink:#171918;--mut:#6b706c;--line:#00000014;--green:#2c5343;--rust:#b9461d;--gold:#e8bb3a;--dark:#171918;--soft:#00000008;--r:26px;--sh:0 8px 30px #0000000d,0 1px 0 #fff9 inset}
body.dk{--bg1:#241d18;--bg2:#161a18;--card:#242826cc;--card2:#2c302d;--ink:#f1efe8;--mut:#9aa09b;--line:#ffffff17;--dark:#0e100f;--soft:#ffffff0d;--sh:0 8px 30px #0006}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:Cairo,"Segoe UI",Tahoma,system-ui,sans-serif;color:var(--ink);background:linear-gradient(150deg,var(--bg1),var(--bg2) 55%) fixed;min-height:100vh;transition:background .3s}
button{font:inherit;color:inherit;cursor:pointer}
header{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;padding:14px 28px;backdrop-filter:blur(14px);background:linear-gradient(var(--bg1)cc,transparent)}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px}
.logo i{display:grid;place-items:center;width:42px;height:42px;border-radius:14px;background:var(--dark);color:#fff;font-style:normal;font-size:22px}
nav{display:flex;gap:4px;background:var(--card);border-radius:99px;padding:5px;box-shadow:var(--sh);margin-inline:auto;overflow-x:auto}
nav button{border:0;background:none;padding:9px 22px;border-radius:99px;white-space:nowrap;font-weight:600;color:var(--mut);transition:.2s}
nav button.on{background:var(--dark);color:#fff}
.ib{display:grid;place-items:center;width:42px;height:42px;border-radius:50%;border:0;background:var(--card);box-shadow:var(--sh);font-size:17px;position:relative}
.ib .dot{position:absolute;top:9px;inset-inline-start:10px;width:9px;height:9px;border-radius:50%;background:var(--rust)}
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:15px;flex:none}
main{padding:6px 28px 90px;max-width:1360px;margin:auto}
.top{display:flex;align-items:center;gap:22px;flex-wrap:wrap;margin:6px 0 20px}
h1{margin:0;font-size:34px;line-height:1.15;font-weight:800}
.pill{display:flex;align-items:center;gap:12px}.pill .ic{width:46px;height:46px;border-radius:50%;background:var(--card);box-shadow:var(--sh);display:grid;place-items:center;font-size:19px}
.pill b{font-size:22px;display:block;line-height:1.1}.pill span{font-size:12.5px;color:var(--mut)}
.badge{font-size:11px;background:var(--green);color:#fff;border-radius:99px;padding:2px 9px;margin-inline-start:6px;vertical-align:middle}
.g{display:grid;gap:16px}
.g12{grid-template-columns:repeat(12,1fr)}
.c{background:var(--card);border-radius:var(--r);padding:22px;box-shadow:var(--sh);backdrop-filter:blur(8px);min-width:0;border:1px solid var(--line)}
.c h3{margin:0;font-size:16px;font-weight:700}
.ch{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.seg{display:flex;background:var(--soft);border-radius:99px;padding:3px}
.seg button{border:0;background:none;padding:5px 14px;border-radius:99px;font-size:13px;color:var(--mut)}.seg button.on{background:var(--card2);color:var(--ink);box-shadow:var(--sh)}
.big{font-size:38px;font-weight:800;line-height:1.1}.sub{color:var(--mut);font-size:13px}
.s4{grid-column:span 4}.s5{grid-column:span 5}.s6{grid-column:span 6}.s7{grid-column:span 7}.s8{grid-column:span 8}.s3{grid-column:span 3}
.hot{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.deal{border-radius:22px;padding:16px;color:#fff;min-height:150px;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer;transition:transform .2s}
.deal:hover{transform:translateY(-3px)}
.deal small{opacity:.75;font-size:12px}.deal h4{margin:4px 0 0;font-size:17px;line-height:1.3}
.deal .f{display:flex;justify-content:space-between;align-items:flex-end}.deal .f b{font-size:22px}
.t-d{background:var(--dark)}.t-g{background:var(--green)}.t-r{background:var(--rust)}.t-y{background:var(--gold);color:#1b1500}
.ring{display:grid;place-items:center;margin:6px 0}
.dkc{background:var(--green);color:#fff}.dkc .sub{color:#ffffffb0}.dkc h3{color:#fff}
.mix{display:flex;height:34px;gap:5px;margin:14px 0}.mix i{border-radius:12px;display:block;min-width:8px}
.row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}.row:last-child{border:0}
.row .n{flex:1;min-width:0}.row .n b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.row .n span{font-size:12px;color:var(--mut)}
.dotc{width:10px;height:10px;border-radius:50%;flex:none}
.prog{height:7px;background:var(--soft);border-radius:9px;overflow:hidden}.prog i{display:block;height:100%;border-radius:9px}
.chk{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);background:none;flex:none;display:grid;place-items:center;font-size:12px}.chk.on{background:var(--green);border-color:var(--green);color:#fff}
.bar{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;align-items:center}
.bar input{flex:1;min-width:180px}
input,select,textarea{font:inherit;border:1px solid var(--line);border-radius:99px;padding:10px 18px;background:var(--card);color:var(--ink);outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--green)}
.chip{border:1px solid var(--line);background:var(--card);padding:7px 15px;border-radius:99px;font-size:13.5px}.chip.on{background:var(--dark);color:#fff;border-color:var(--dark)}
.btn{border:1px solid var(--line);background:var(--card);padding:10px 18px;border-radius:99px;font-weight:600;box-shadow:var(--sh)}.btn.dk{background:var(--dark);color:#fff;border-color:var(--dark)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:16px}
.cc{cursor:pointer;transition:transform .2s}.cc:hover{transform:translateY(-3px)}
.cc .hd{display:flex;gap:12px;align-items:center}.cc h3{font-size:16px}.cc .hd small{color:var(--mut);font-size:12.5px}
.star{margin-inline-start:auto;border:1px solid var(--line);background:none;width:30px;height:30px;border-radius:50%;font-size:14px;color:var(--mut)}.star.on{background:var(--gold);border-color:var(--gold);color:#1b1500}
.meta{display:flex;justify-content:space-between;background:var(--soft);border-radius:16px;padding:11px 14px;margin:14px 0 12px;font-size:12px;color:var(--mut)}.meta b{display:block;color:var(--ink);font-size:14.5px}
.tag{display:inline-block;padding:3px 12px;border-radius:99px;font-size:12px;font-weight:600;background:var(--soft)}
.ok{background:#cfe3d6;color:#1f4a37}.warn{background:#f7e5ae;color:#6d5200}.bad{background:#f3d1c3;color:#9a3510}.off{background:#ddd;color:#555}
body.dk .ok{background:#2c5343;color:#d5efe0}body.dk .warn{background:#5a4a14;color:#fbe9a8}body.dk .bad{background:#5a2d1c;color:#ffd5c2}
table{width:100%;border-collapse:collapse}th,td{padding:13px 12px;text-align:right;border-bottom:1px solid var(--line);font-size:14px}th{color:var(--mut);font-weight:600;font-size:12.5px}
tr.rw{cursor:pointer}tr.rw:hover td{background:var(--soft)}
.legend{display:flex;gap:16px;font-size:12.5px;color:var(--mut);margin-top:6px}.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-inline-end:6px}
.dock{position:fixed;inset-inline-end:12px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:6px;background:var(--dark);border-radius:99px;padding:10px 7px;z-index:15;box-shadow:0 10px 30px #0004}
.dock button{width:38px;height:38px;border-radius:50%;border:0;background:none;color:#ffffffcc;font-size:17px}.dock button:hover{background:#ffffff1f}
.dock hr{border:0;border-top:1px solid #ffffff22;width:70%;margin:3px auto}
.empty{text-align:center;padding:60px 20px}.empty .big{font-size:26px}
dialog{border:0;border-radius:28px;padding:26px;width:min(470px,93vw);background:var(--card2);color:var(--ink);direction:rtl;box-shadow:0 30px 80px #0006}
dialog::backdrop{background:#0007;backdrop-filter:blur(4px)}
label{display:block;margin:13px 0 5px;font-size:13px;color:var(--mut)}dialog input,dialog select,dialog textarea{width:100%;border-radius:14px}
.note{color:var(--mut);font-size:12.5px;margin-top:22px;text-align:center}
.tip{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--dark);color:#fff;padding:10px 20px;border-radius:99px;z-index:50;font-size:14px}
@media(min-width:981px){main{padding-inline-end:84px}}
@media(max-width:980px){.s4,.s5,.s6,.s7,.s8,.s3{grid-column:span 12}.dock{display:none}header{padding:12px 14px;flex-wrap:wrap}main{padding:6px 14px 60px}h1{font-size:27px}.hot{grid-template-columns:1fr 1fr}nav{order:5;width:100%}}
</style>
</head>
<body>
<header>
  <div class="logo"><i>B</i>Black</div>
  <nav id="nav">
    <button data-p="overview" class="on">نظرة عامة</button><button data-p="customers">العملاء</button><button data-p="subs">الاشتراكات</button><button data-p="sources">النمو والمصادر</button>
  </nav>
  <button class="ib" id="bell" title="تنبيهات"><span>🔔</span><span class="dot" id="bdot" hidden></span></button>
  <div class="av" style="background:var(--dark);color:#fff" title="Black">B</div>
</header>
<div class="dock" id="dock">
  <button data-a="search" title="بحث">⌕</button><button data-a="add" title="عميل جديد">＋</button><button data-a="fav" title="المفضلة">☆</button>
  <hr><button data-a="imp" title="استيراد التراخيص">⇩</button><button data-a="exp" title="تصدير CSV">⇧</button><button data-a="demo" title="بيانات تجريبية">◎</button>
  <hr><button data-a="clear" title="مسح البيانات">⌫</button><button data-a="theme" title="الوضع الليلي">☾</button>
</div>
<main id="app"></main>
<dialog id="dlg"></dialog>
<input type="file" id="file" accept=".json" hidden>

<script>
const $=id=>document.getElementById(id);
const SRC=["واتساب","ديسكورد","موقع","توصية","أخرى"],SC={"واتساب":"#3a9a5a","ديسكورد":"#6a4fc0","موقع":"#2c5343","توصية":"#e8bb3a","أخرى":"#b9461d"};
const PAY={paid:"مدفوع",due:"مستحق",late:"متأخر"},ST_C={ok:"#2c5343",warn:"#e8bb3a",bad:"#b9461d",off:"#8a8f8b"};
const AVC=["#f3d9c6","#d9e6dc","#e4dcf3","#f6e8b6","#d8e5ee","#f0d3d3"];
const DAY=864e5,MON=["يناير","فبراير","مارس","أبريل","مايو","يونيو","يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"];
let page="overview",filter="all",q="",range=6,L,E,ACT,CFG;
const ld=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}};
L=ld("bk_lic",[]);E=ld("bk_extra",{});ACT=ld("bk_act",[]);CFG=ld("bk_cfg",{target:150,dark:false,todo:{}});
const save=()=>{localStorage.setItem("bk_lic",JSON.stringify(L));localStorage.setItem("bk_extra",JSON.stringify(E));localStorage.setItem("bk_act",JSON.stringify(ACT));localStorage.setItem("bk_cfg",JSON.stringify(CFG))};
document.body.classList.toggle("dk",!!CFG.dark);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const parseExp=s=>{const m=String(s||"").match(/^(\d{4})-(\d\d)-(\d\d)-(\d\d)-(\d\d)-(\d\d)$/);return m?Date.UTC(+m[1],m[2]-1,+m[3],+m[4],+m[5],+m[6]):Date.parse(s)};
const fp=k=>String(k||"").slice(-8);
const fmt=t=>isNaN(t)?"—":new Date(t).toLocaleDateString("ar-KW",{day:"numeric",month:"short",year:"numeric"});
const kd=n=>(Math.round(n*10)/10).toLocaleString("en")+" د.ك";
const ini=n=>String(n).trim().slice(0,2);
const avc=id=>AVC[[...String(id)].reduce((a,c)=>a+c.charCodeAt(0),0)%AVC.length];
const av=x=>`<div class="av" style="background:${avc(x.id)};color:#3b2f22">${esc(ini(x.name))}</div>`;
const ago=t=>{const m=Math.round((Date.now()-t)/6e4);return m<1?"الحين":m<60?`قبل ${m} د`:m<1440?`قبل ${Math.round(m/60)} س`:`قبل ${Math.round(m/1440)} يوم`};
function log(t){ACT.unshift({t,at:Date.now()});ACT=ACT.slice(0,30)}
function view(l){
  const e=E[l.id]||{};const exp=parseExp(l.expiresUTC),days=Math.ceil((exp-Date.now())/DAY);
  let st="ok",lab="نشط";if(!l.enabled){st="off";lab="معطّل"}else if(days<0){st="bad";lab="منتهي"}else if(days<=14){st="warn";lab="قارب ينتهي"}
  return{...l,e,days,st,lab,exp,pay:e.pay||"paid",src:e.src||"أخرى",amt:+e.amount||0};
}
const all=()=>L.map(view);
const payTag=x=>`<span class="tag ${x.pay==="paid"?"ok":x.pay==="late"?"bad":"warn"}">${PAY[x.pay]}</span>`;
const dleft=x=>x.days<0?"منتهي":x.days+" يوم";

/* ---------- SVG helpers ---------- */
function monthly(a,n){ // paid revenue per month for last n months
  const out=[],now=new Date();
  for(let i=n-1;i>=0;i--){const d=new Date(now.getFullYear(),now.getMonth()-i,1);out.push({y:d.getFullYear(),m:d.getMonth(),v:0,c:0,n:0})}
  a.forEach(x=>{if(x.pay!=="paid"||!x.amt)return;const t=new Date(x.e.paidAt||Date.now());const o=out.find(o=>o.y===t.getFullYear()&&o.m===t.getMonth());if(o){o.v+=x.amt;o.n++}});
  return out;
}
function area(data,{target,color="#b9461d",h=190}={}){
  const W=640,H=h,P=26,mx=Math.max(target||0,...data.map(d=>d.v),1)*1.15,st=(W-P*2)/Math.max(data.length-1,1);
  const pts=data.map((d,i)=>[P+i*st,H-P-(d.v/mx)*(H-P*2)]);
  let p=pts.map((q,i)=>i?`C${(pts[i-1][0]+q[0])/2},${pts[i-1][1]} ${(pts[i-1][0]+q[0])/2},${q[1]} ${q[0]},${q[1]}`:`M${q[0]},${q[1]}`).join(" ");
  const ar=p+` L${pts.at(-1)[0]},${H-P} L${pts[0][0]},${H-P} Z`;
  const ty=target?H-P-(target/mx)*(H-P*2):null;
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block"><defs><linearGradient id="gg${color.slice(1)}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${color}" stop-opacity=".28"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>
  ${[0,1,2].map(i=>`<line x1="${P}" x2="${W-P}" y1="${P+i*(H-P*2)/2}" y2="${P+i*(H-P*2)/2}" stroke="currentColor" stroke-opacity=".08"/>`).join("")}
  ${ty!=null?`<line x1="${P}" x2="${W-P}" y1="${ty}" y2="${ty}" stroke="currentColor" stroke-dasharray="6 5" stroke-opacity=".55"/>`:""}
  <path d="${ar}" fill="url(#gg${color.slice(1)})"/><path d="${p}" fill="none" stroke="${color}" stroke-width="3" stroke-linecap="round"/>
  ${pts.map((q,i)=>i===pts.length-1?`<circle cx="${q[0]}" cy="${q[1]}" r="6" fill="${color}" stroke="#fff" stroke-width="2.5"/>`:"").join("")}
  ${data.map((d,i)=>`<text x="${P+i*st}" y="${H-5}" font-size="11" text-anchor="middle" fill="currentColor" fill-opacity=".5">${MON[d.m].slice(0,4)}</text>`).join("")}</svg>`;
}
function ringSvg(pct,sz=150,col="#e8bb3a",tr="#ffffff26",txt="#fff",lab=""){
  const r=sz/2-12,c=2*Math.PI*r;
  return `<svg width="${sz}" height="${sz}" viewBox="0 0 ${sz} ${sz}"><circle cx="${sz/2}" cy="${sz/2}" r="${r}" fill="none" stroke="${tr}" stroke-width="13"/>
  <circle cx="${sz/2}" cy="${sz/2}" r="${r}" fill="none" stroke="${col}" stroke-width="13" stroke-linecap="round" stroke-dasharray="${c*pct/100} ${c}" transform="rotate(-90 ${sz/2} ${sz/2})"/>
  <text x="50%" y="50%" text-anchor="middle" dy=".1em" font-size="${sz/4.3}" font-weight="800" fill="${txt}">${Math.round(pct)}%</text><text x="50%" y="${sz/2+sz/6}" text-anchor="middle" font-size="11" fill="${txt}" fill-opacity=".7">${lab}</text></svg>`;
}
function donut(parts,sz=170){
  const tot=parts.reduce((s,p)=>s+p.v,0)||1,r=sz/2-14,c=2*Math.PI*r;let off=0;
  return `<svg width="${sz}" height="${sz}" viewBox="0 0 ${sz} ${sz}"><circle cx="${sz/2}" cy="${sz/2}" r="${r}" fill="none" stroke="currentColor" stroke-opacity=".08" stroke-width="22"/>`+
  parts.map(p=>{const l=p.v/tot*c,s=`<circle cx="${sz/2}" cy="${sz/2}" r="${r}" fill="none" stroke="${p.c}" stroke-width="22" stroke-dasharray="${Math.max(l-3,0)} ${c}" stroke-dashoffset="${-off}" transform="rotate(-90 ${sz/2} ${sz/2})"/>`;off+=l;return s}).join("")+
  `<text x="50%" y="50%" text-anchor="middle" font-size="34" font-weight="800" fill="currentColor">${tot}</text><text x="50%" y="${sz/2+22}" text-anchor="middle" font-size="12" fill="currentColor" fill-opacity=".55">عميل</text></svg>`;
}
function stacked(data){ // monthly new customers
  const mx=Math.max(...data.map(d=>d.n),1);
  return `<div style="display:flex;gap:10px;align-items:flex-end;height:170px">`+data.map((d,i)=>`<div style="flex:1;text-align:center"><div style="height:140px;background:var(--soft);border-radius:14px;display:flex;align-items:flex-end;overflow:hidden"><div style="width:100%;height:${d.n/mx*100}%;background:${i===data.length-1?"var(--rust)":"var(--dark)"};border-radius:14px;min-height:${d.n?10:0}px"></div></div><small style="color:var(--mut);font-size:11px">${MON[d.m].slice(0,4)}</small></div>`).join("")+`</div>`;
}

/* ---------- Pages ---------- */
function match(x){
  if(q&&!(x.name+" "+(x.e.discord||"")).toLowerCase().includes(q.toLowerCase()))return false;
  if(filter==="all")return true;if(filter==="fav")return !!x.e.fav;if(filter==="late")return x.pay==="late";return x.st===filter;
}
const chips=()=>[["all","الكل"],["ok","نشط"],["warn","قارب ينتهي"],["bad","منتهي"],["late","متأخر الدفع"],["fav","★ المفضلة"]].map(([k,t])=>`<span class="chip ${filter===k?"on":""}" data-f="${k}">${t}</span>`).join("");
const tools=()=>`<div class="bar"><input id="q" placeholder="ابحث بالاسم أو الديسكورد…" value="${esc(q)}">${chips()}</div>`;
const pills=(a)=>{
  const act=a.filter(x=>x.st==="ok"||x.st==="warn").length,rev=a.reduce((s,x)=>s+(x.pay==="paid"?x.amt:0),0),due=a.reduce((s,x)=>s+(x.pay!=="paid"?x.amt:0),0);
  return `<div class="pill"><div class="ic">👥</div><div><b>${a.length}</b><span>إجمالي العملاء</span></div></div>
  <div class="pill"><div class="ic">✓</div><div><b>${act}<span class="badge">${a.length?Math.round(act/a.length*100):0}%</span></b><span>اشتراكات فعّالة</span></div></div>
  <div class="pill"><div class="ic">💰</div><div><b>${kd(rev)}</b><span>إجمالي المدفوع</span></div></div>
  <div class="pill"><div class="ic">⏳</div><div><b>${kd(due)}</b><span>مستحق / متأخر</span></div></div>`;
};
function overview(a){
  const m=monthly(a,range*1===12?12:6),tot=m.reduce((s,d)=>s+d.v,0),thisM=m.at(-1).v,prev=m.at(-2)?.v||0;
  const soon=[...a].filter(x=>x.st!=="off").sort((p,q)=>p.exp-q.exp).slice(0,6);
  const cols=["t-d","t-d","t-g","t-g","t-r","t-r"];
  const act=a.filter(x=>x.st==="ok"||x.st==="warn").length,pct=a.length?act/a.length*100:0;
  const mix=[["ok","نشط"],["warn","قارب ينتهي"],["bad","منتهي"],["off","معطّل"]].map(([k,t])=>({k,t,n:a.filter(x=>x.st===k).length,v:a.filter(x=>x.st===k).reduce((s,x)=>s+x.amt,0)}));
  const todo=a.filter(x=>x.st==="warn"||x.pay==="late"||(x.st==="bad"&&x.pay!=="paid")).slice(0,5);
  const top=[...a].sort((p,q)=>q.amt-p.amt).slice(0,5),tmx=top[0]?.amt||1;
